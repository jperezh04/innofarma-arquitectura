<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 4.1 - BPMN 2.0 Venta en Mostrador | Innofarma</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Barra de Control Superior HUD (Estilo Marifarma Salud) */
        .hud-bar {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border: 1.5px solid #0d9488;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 11.5px;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.14);
            flex-wrap: wrap;
        }
        .hud-status-badge {
            background: #0d9488;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .hud-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-hud {
            background: #ffffff;
            color: #0f766e;
            border: 1.5px solid #0d9488;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-hud:hover {
            background: #0d9488;
            color: #ffffff;
        }
        .zoom-text {
            font-weight: 700;
            min-width: 44px;
            text-align: center;
            font-size: 11.5px;
            color: #0f766e;
        }
        .hud-hint {
            font-size: 10.5px;
            color: #64748b;
            margin-right: 4px;
            white-space: nowrap;
        }

        /* Lienzo del Diagrama */
        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(#ccfbf1 1.1px, transparent 1.1px);
            background-size: 24px 24px;
            background-color: #f8fafc;
            overflow: hidden;
            cursor: grab;
            width: 100vw;
            height: 100vh;
        }
        .canvas-container:active { cursor: grabbing; }

        .diagram-viewport {
            transform-origin: 0 0;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Estilos SVG de BPMN — Paleta Marifarma Salud */
        .lane-text { fill: #ffffff; font-weight: 800; font-size: 12.5px; text-anchor: middle; letter-spacing: 0.4px; font-family: "Segoe UI", Arial, sans-serif; }

        .task-box { fill: #ffffff; stroke: #0d9488; stroke-width: 2; rx: 8; ry: 8; }
        .task-box-db { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; ry: 8; }
        .task-box-hw { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 8; ry: 8; }
        .task-box-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 7; ry: 7; }

        .task-title { font-size: 11.5px; font-weight: 800; text-anchor: middle; fill: #0f172a; font-family: "Segoe UI", Arial, sans-serif; }
        .task-sub { font-size: 10.5px; font-family: Consolas, monospace; fill: #475569; text-anchor: middle; }

        .gateway { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; }
        .gateway-x { stroke: #92400e; stroke-width: 2.5; stroke-linecap: round; }
        .gateway-label { font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #78350f; }

        .seq-flow { stroke: #0f766e; stroke-width: 2; fill: none; stroke-linejoin: round; }
        .flow-label { font-size: 11px; font-weight: 800; fill: #0f766e; }

        @media (max-width: 768px) {
            .hud-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- BARRA DE CONTROL FLOTANTE (HUD) -->
    <header class="hud-bar">
        <span class="hud-status-badge">BPMN 2.0 • VENTA GLOBAL</span>
        <span class="hud-hint">Arrastrar: Pan | Rueda: Zoom</span>
        <div class="hud-controls">
            <button class="btn-hud" onclick="zoomStep(-0.1)">− Zoom</button>
            <span class="zoom-text" id="zoom-level">100%</span>
            <button class="btn-hud" onclick="zoomStep(0.1)">+ Zoom</button>
            <button class="btn-hud" onclick="fitToScreen()">Ajustar</button>
            <button class="btn-hud" onclick="resetZoom()">Reset</button>
            <button class="btn-hud" onclick="downloadSvg()">Descargar SVG</button>
        </div>
    </header>

    <!-- Contenedor del Diagrama BPMN -->
    <div class="canvas-container" id="container">
        <div class="diagram-viewport" id="viewport">
            <svg id="bpmn-svg" width="1700" height="880" viewBox="0 0 1700 880" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
                    </marker>
                    <filter id="soft-shadow" x="-3%" y="-3%" width="106%" height="108%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
                    </filter>
                </defs>

                <!-- Cuadro exterior del pool -->
                <rect x="10" y="10" width="1680" height="860" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#soft-shadow)"/>

                <!-- Fondos semánticos suaves por carril -->
                <rect x="52" y="10" width="1638" height="150" fill="#f8fafc"/>
                <rect x="52" y="160" width="1638" height="170" fill="#f0fdfa"/>
                <rect x="52" y="330" width="1638" height="200" fill="#ffffff"/>
                <rect x="52" y="530" width="1638" height="200" fill="#ecfdf5" fill-opacity="0.55"/>
                <rect x="52" y="730" width="1638" height="140" fill="#f8fafc"/>

                <!-- CARRIL 1: CLIENTE / COMPRADOR (y: 10 a 160) -->
                <line x1="10" y1="160" x2="1690" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
                <rect x="10" y="10" width="42" height="150" fill="#475569"/>
                <text x="-85" y="36" transform="rotate(-90)" class="lane-text">CLIENTE / COMPRADOR</text>

                <!-- CARRIL 2: CAJERA / MOSTRADOR PWA (y: 160 a 330) -->
                <line x1="10" y1="330" x2="1690" y2="330" stroke="#99f6e4" stroke-width="1.5"/>
                <rect x="10" y="160" width="42" height="170" fill="#0d9488"/>
                <text x="-245" y="36" transform="rotate(-90)" class="lane-text">CAJERA / MOSTRADOR (PWA)</text>

                <!-- CARRIL 3: BACKEND LARAVEL 11 (y: 330 a 530) -->
                <line x1="10" y1="530" x2="1690" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
                <rect x="10" y="330" width="42" height="200" fill="#0f766e"/>
                <text x="-430" y="36" transform="rotate(-90)" class="lane-text">BACKEND (LARAVEL 11)</text>

                <!-- CARRIL 4: BASE DE DATOS POSTGRESQL 16 (y: 530 a 730) -->
                <line x1="10" y1="730" x2="1690" y2="730" stroke="#a7f3d0" stroke-width="1.5"/>
                <rect x="10" y="530" width="42" height="200" fill="#059669"/>
                <text x="-630" y="36" transform="rotate(-90)" class="lane-text">POSTGRESQL 16 (ACID)</text>

                <!-- CARRIL 5: PERIFÉRICOS DE HARDWARE (y: 730 a 870) -->
                <rect x="10" y="730" width="42" height="140" fill="#334155"/>

                <!-- LEYENDA (Arriba Centro-Izquierda) -->
                <rect x="370" y="20" width="380" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
                <text x="384" y="38" font-size="11.5px" font-weight="800" fill="#0f766e">LEYENDA DE ORQUESTACIÓN BPMN 2.0 — MARIFARMA SALUD</text>
                <text x="384" y="53" font-size="10px" font-family="Consolas, monospace" fill="#64748b">EDU-0004 • EDU-0002 • EDU-0011 (VENTA EN MOSTRADOR)</text>
                <circle cx="394" cy="68" r="5" stroke="#059669" stroke-width="2" fill="#d1fae5"/>
                <text x="406" y="72" font-size="10.5px" fill="#334155">Evento Inicio / Fin: Apertura y cierre de atención al cliente</text>
                <polygon points="394,78 400,84 394,90 388,84" stroke="#d97706" stroke-width="1.5" fill="#fef3c7"/>
                <text x="406" y="88" font-size="10.5px" fill="#334155">Compuerta Exclusiva (XOR): Validación condicional [Sí / No]</text>

                <text x="95" y="116" font-size="11px" font-weight="700" fill="#065f46" text-anchor="middle">Inicio Venta</text>

                <!-- Tareas Carril 1 (Cliente) -->

                <rect x="360" y="215" width="165" height="60" class="task-box"/>

                <rect x="985" y="215" width="170" height="60" class="task-box" style="fill:#fffbeb;stroke:#d97706;"/>
                <text x="1070" y="240" class="task-title">CONFIRMAR COBRO CAJA</text>

                <rect x="1455" y="215" width="160" height="60" class="task-box"/>
                <text x="1535" y="240" class="task-title">ENTREGAR TICKET Y PROD.</text>
                <text x="1535" y="258" class="task-sub">Atención finalizada</text>

                <!-- EVENTO FIN (Carril 2) -->

                <rect x="360" y="395" width="165" height="64" class="task-box"/>

                <polygon points="570,397 596,427 570,457 544,427" class="gateway"/>
                <line x1="563" y1="420" x2="577" y2="434" class="gateway-x"/>
                <line x1="563" y1="434" x2="577" y2="420" class="gateway-x"/>

                <rect x="490" y="340" width="165" height="44" class="task-box-warn"/>

                <rect x="985" y="395" width="170" height="64" class="task-box"/>

                <text x="1070" y="443" class="task-sub">DB::transaction(BEGIN)</text>

                <!-- Gateway 2 -->
                <polygon points="1210,397 1236,427 1210,457 1184,427" class="gateway"/>
                <line x1="1203" y1="420" x2="1217" y2="434" class="gateway-x"/>
                <line x1="1203" y1="434" x2="1217" y2="420" class="gateway-x"/>
                <text x="1210" y="476" class="gateway-label">¿Commit OK?</text>

                <rect x="1130" y="340" width="165" height="44" class="task-box-warn"/>
                <text x="1212" y="359" class="task-title" style="font-size:10.5px;">ROLLBACK Y NOTIFICAR</text>
                <text x="1212" y="375" class="task-sub">Reversión limpia de lote</text>

                <rect x="1280" y="395" width="155" height="64" class="task-box"/>
                <text x="1357" y="423" class="task-title">GENERAR COMPROBANTE</text>
                <text x="1357" y="443" class="task-sub">Boleta + Auditoría</text>

                <!-- Tareas Carril 4 (Base de Datos PostgreSQL) -->
                <rect x="488" y="600" width="168" height="64" class="task-box-db"/>
                <text x="572" y="628" class="task-title">SELECT FOR UPDATE LOTES</text>
                <text x="572" y="648" class="task-sub">Bloqueo pesimista fila</text>

                <rect x="985" y="600" width="170" height="64" class="task-box-db"/>
                <text x="1070" y="628" class="task-title">UPDATE STOCK POR LOCAL</text>
                <text x="1070" y="648" class="task-sub">INSERT ventas + caja</text>

                <rect x="1200" y="600" width="155" height="64" class="task-box-db"/>
                <text x="1277" y="628" class="task-title">COMMIT ACID POSTGRESQL</text>
                <text x="1277" y="648" class="task-sub">Escritura duradera NVMe</text>

                <!-- Tareas Carril 5 (Periféricos Hardware) -->
                <rect x="360" y="770" width="165" height="56" class="task-box-hw"/>
                <text x="442" y="796" class="task-title">LECTOR CÓDIGO BARRAS</text>

                <rect x="1280" y="770" width="155" height="56" class="task-box-hw"/>
                <text x="1357" y="796" class="task-title">IMPRESORA TÉRMICA 80MM</text>
                <text x="1357" y="814" class="task-sub">Comandos ESC/POS + Corte</text>

                <!-- FLECHAS DE CONEXIÓN ORTOGONALES -->
                <path d="M 110 85 L 160 85" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 245 115 L 245 215" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 330 245 L 360 245" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 442 275 L 442 770" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 525 798 L 542 798 L 542 500 L 442 500 L 442 459" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 525 427 L 544 427" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 570 457 L 570 600" class="seq-flow" marker-end="url(#arrow)"/>

                <!-- Gateway 1 -> Error [No] -->
                <path d="M 570 397 L 570 384" class="seq-flow" marker-end="url(#arrow)"/>
                <text x="577" y="393" class="flow-label">[No]</text>
                <path d="M 490 362 L 342 362 L 342 245 L 360 245" class="seq-flow" marker-end="url(#arrow)"/>

                <!-- Gateway 1 -> Cliente Paga [Sí] -->
                <path d="M 596 427 L 740 427 L 740 85 L 785 85" class="seq-flow" marker-end="url(#arrow)"/>
                <text x="606" y="420" class="flow-label">[Sí]</text>

                <!-- Cliente Paga -> Cajera Cobro -->
                <path d="M 960 85 L 972 85 L 972 245 L 985 245" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1070 275 L 1070 395" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1070 459 L 1070 600" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1155 632 L 1200 632" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1277 600 L 1277 516 L 1210 516 L 1210 457" class="seq-flow" marker-end="url(#arrow)"/>

                <!-- Gateway 2 -> Error [No] -->
                <path d="M 1210 397 L 1210 384" class="seq-flow" marker-end="url(#arrow)"/>

                <!-- Gateway 2 -> Generar Comprobante [Sí] -->
                <path d="M 1236 427 L 1280 427" class="seq-flow" marker-end="url(#arrow)"/>
                <text x="1243" y="420" class="flow-label">[Sí]</text>

                <path d="M 1357 459 L 1357 770" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1435 798 L 1446 798 L 1446 245 L 1455 245" class="seq-flow" marker-end="url(#arrow)"/>
                <path d="M 1615 245 L 1636 245" class="seq-flow" marker-end="url(#arrow)"/>
            </svg>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const viewport = document.getElementById('viewport');
        const zoomLevelText = document.getElementById('zoom-level');

        let scale = 1;
        let pointX = 20;
        let pointY = 20;
        let start = { x: 0, y: 0 };
        let isPanning = false;

        function updateTransform() {
            viewport.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomLevelText.innerText = Math.round(scale * 100) + '%';
        }

        container.onmousedown = function (e) {
            if (e.target.closest('.hud-bar')) return;
            e.preventDefault();
            start = { x: e.clientX - pointX, y: e.clientY - pointY };
            isPanning = true;
        };

        window.onmouseup = function () { isPanning = false; };

        window.onmousemove = function (e) {
            if (!isPanning) return;
            e.preventDefault();
            pointX = e.clientX - start.x;
            pointY = e.clientY - start.y;
            updateTransform();
        };

        container.onwheel = function (e) {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            scale = (-e.deltaY > 0) ? (scale * 1.1) : (scale / 1.1);
            scale = Math.min(Math.max(0.2, scale), 3.5);
            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            updateTransform();
        };

        function zoomStep(factor) {
            scale = Math.min(Math.max(0.2, scale + factor), 3.5);
            updateTransform();
        }

        function resetZoom() {
            fitToScreen();
        }

        function fitToScreen() {
            const containerW = container.clientWidth;
            const containerH = container.clientHeight;
            scale = Math.min((containerW - 36) / 1700, (containerH - 72) / 880);
            pointX = (containerW - 1700 * scale) / 2;
            pointY = Math.max(54, (containerH - 880 * scale) / 2 + 16);
            updateTransform();
        }

        function downloadSvg() {
            const svgEl = document.getElementById('bpmn-svg');
            const serializer = new XMLSerializer();
            const blob = new Blob([serializer.serializeToString(svgEl)], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Vista_Procesos_BPMN_Venta_Innofarma.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.addEventListener('load', fitToScreen);
        window.addEventListener('resize', fitToScreen);
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'm' || e.key === 'M') && window.parent && window.parent !== window && typeof window.parent.toggleSidebar === 'function') {
                window.parent.toggleSidebar();
            }
        });
    </script>
</body>
</html>
