<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fig 5.5 - Comparativa de Arquitecturas | Innofarma</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* BARRA DE CONTROL FLOTANTE (ESTILO MARIFARMA SALUD) */
    .hud-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid #0d9488;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 11.5px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.12);
    }

    .hud-status-badge {
      background: #0d9488;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-hud {
      background: #ffffff;
      color: #0f766e;
      border: 1.5px solid #0d9488;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-hud:hover {
      background: #0d9488;
      color: #ffffff;
    }

    .zoom-text {
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      font-size: 11.5px;
      color: #0f766e;
    }

    .hud-hint {
      font-size: 10.5px;
      color: #64748b;
      margin-right: 6px;
      white-space: nowrap;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(#ccfbf1 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #f8fafc;
      cursor: grab;
    }

    #container:active {
      cursor: grabbing;
    }

    #mermaid-target {
      width: 100%;
      height: 100%;
    }

    #mermaid-target svg {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

  <header class="hud-bar">
    <span class="hud-status-badge">VISTA FÍSICA</span>
    <span class="hud-hint">Arrastrar: Pan | Rueda: Zoom</span>
    <div class="hud-controls">
      <button class="btn-hud" id="btnZoomOut">− Zoom</button>
      <span class="zoom-text" id="zoomText">100%</span>
      <button class="btn-hud" id="btnZoomIn">+ Zoom</button>
      <button class="btn-hud" id="btnFit">Ajustar</button>
      <button class="btn-hud" id="btnReset">Reset</button>
      <button class="btn-hud" id="btnCopy">Copiar Código</button>
    </div>
  </header>

  <div id="container">
    <div id="mermaid-target"></div>
  </div>

  <script>
    const mermaidCode = `flowchart TD
    subgraph CRITERIOS ["Dimensiones de Comparación Arquitectónica"]
        direction LR
        C1["Disponibilidad Operativa"]
        C2["Dependencia de Internet"]
        C3["Seguridad de Datos"]
        C4["Rendimiento y Latencia"]
        C5["Costos Mensuales"]
        C6["Mantenimiento Técnico"]
    end

    subgraph OPCION_A ["Opción A: Aplicación Web Local en PC ThinkCentre (Recomendada)"]
        direction TB
        A1["Alta en Local 1. Si cae Internet, Local 1 vende al 100% y Local 2 entra en modo offline."]
        A2["CERO en Local 1. Media en Local 2 (usa IndexedDB si no hay conexión)."]
        A3["Datos permanecen físicamente en el local. Solo se abre puerto VPN UDP 51820."]
        A4["Ultra rápida (< 15 ms en LAN Local 1; < 60 ms en túnel Local 2)."]
        A5["S/. 0.00 en servidores (Aprovecha hardware propio ya adquirido)."]
        A6["Requiere copias de seguridad locales y configuración de UPS para cortes de luz."]
    end

    subgraph OPCION_B ["Opción B: Servidor Central en la Nube (OCI Always Free / AWS)"]
        direction TB
        B1["99.9% en data center. Pero si se corta la fibra en la farmacia, no hay acceso central."]
        B2["TOTAL. Si cualquiera de los 2 locales pierde Internet, ambos dependen de offline."]
        B3["Aislado en la nube con reglas de firewall del proveedor."]
        B4["Latencia WAN estándar a data center (70 ms - 150 ms por cada clic)."]
        B5["Gratis en capa Free Tier; riesgo de cobro por consumo excedente o suspensión de cuenta."]
        B6["Mantenimiento de servidor tercerizado; configuración remota más limpia."]
    end

    C1 -.-> A1
    C1 -.-> B1
    C2 -.-> A2
    C2 -.-> B2
    C3 -.-> A3
    C3 -.-> B3
    C4 -.-> A4
    C4 -.-> B4
    C5 -.-> A5
    C5 -.-> B5
    C6 -.-> A6
    C6 -.-> B6`;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'Segoe UI, Arial, sans-serif',
        fontSize: '13px',
        primaryColor: '#ccfbf1',
        primaryTextColor: '#0f172a',
        primaryBorderColor: '#0d9488',
        lineColor: '#0f766e',
        secondaryColor: '#ecfdf5',
        tertiaryColor: '#f0fdfa'
      }
    });

    let panZoomInstance = null;

    async function renderDiagram() {
      const target = document.getElementById('mermaid-target');
      const { svg } = await mermaid.render('mermaid-svg-55', mermaidCode);
      target.innerHTML = svg;

      const svgElement = target.querySelector('svg');
      svgElement.style.maxWidth = 'none';
      panZoomInstance = svgPanZoom(svgElement, {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.25,
        maxZoom: 5.0,
        onZoom: function(newScale) {
          document.getElementById('zoomText').textContent = `${Math.round(newScale * 100)}%`;
        }
      });

      document.getElementById('btnZoomIn').addEventListener('click', () => panZoomInstance.zoomIn());
      document.getElementById('btnZoomOut').addEventListener('click', () => panZoomInstance.zoomOut());
      document.getElementById('btnFit').addEventListener('click', () => {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      });

      document.getElementById('btnCopy').addEventListener('click', () => {
        navigator.clipboard.writeText(mermaidCode);
        const btn = document.getElementById('btnCopy');
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    window.addEventListener('load', renderDiagram);
    window.addEventListener('resize', () => {
      if (panZoomInstance) {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    });
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && window.parent && window.parent !== window && typeof window.parent.toggleSidebar === 'function') {
        window.parent.toggleSidebar();
      }
    });
  </script>
</body>
</html>
