<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fig 4.4 - Catálogo de Medicamentos | Innofarma</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* BARRA DE CONTROL FLOTANTE (ESTILO MARIFARMA SALUD) */
    .hud-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid #059669;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 11.5px;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.12);
    }

    .hud-status-badge {
      background: #059669;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-hud {
      background: #ffffff;
      color: #047857;
      border: 1.5px solid #059669;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-hud:hover {
      background: #059669;
      color: #ffffff;
    }

    .zoom-text {
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      font-size: 11.5px;
      color: #047857;
    }

    .hud-hint {
      font-size: 10.5px;
      color: #64748b;
      margin-right: 6px;
      white-space: nowrap;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(#d1fae5 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #f8fafc;
      cursor: grab;
    }

    #container:active {
      cursor: grabbing;
    }

    #mermaid-target {
      width: 100%;
      height: 100%;
    }

    #mermaid-target svg {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

  <header class="hud-bar">
    <span class="hud-status-badge">VISTA DE PROCESOS</span>
    <span class="hud-hint">Arrastrar: Pan | Rueda: Zoom</span>
    <div class="hud-controls">
      <button class="btn-hud" id="btnZoomOut">− Zoom</button>
      <span class="zoom-text" id="zoomText">100%</span>
      <button class="btn-hud" id="btnZoomIn">+ Zoom</button>
      <button class="btn-hud" id="btnFit">Ajustar</button>
      <button class="btn-hud" id="btnReset">Reset</button>
      <button class="btn-hud" id="btnCopy">Copiar Código</button>
    </div>
  </header>

  <div id="container">
    <div id="mermaid-target"></div>
  </div>

  <script>
    const mermaidCode = `sequenceDiagram
    autonumber
    actor Regente as Químico Farmacéutico / Admin
    participant PWA as Módulo Catálogo (PWA)
    participant Ctrl as CatalogoController (Laravel 11)
    participant Service as MedicamentoService (Reglas Sanitarias)
    participant DB as PostgreSQL 16 (Transaccional)

    Note over Regente,DB: FASE 1: Captura de Datos Comerciales y Sanitarios (ILA-0009 / ILA-0021)
    Regente->>PWA: Ingresa ficha técnica: Nombre comercial, Principio Activo (DCI), Reg. Sanitario, Condición de Receta
    Regente->>PWA: Define presentaciones: Caja x 100, Blíster x 10, Unidad (Factores de conversión y Precios)
    PWA->>PWA: Validación de frontend (RegEx de Registro Sanitario DIGEMID)
    PWA->>Ctrl: POST /api/v1/medicamentos (Payload estructurado JSON + Token Bearer)

    Note over Ctrl,Service: FASE 2: Validación de Reglas de Negocio y Unicidad (EDU-0005 / EDU-0008)
    Ctrl->>Service: registrarMedicamentoConPresentaciones(datosMedicamento)
    Service->>DB: SELECT id_producto FROM productos WHERE codigo_barras = ? OR registro_sanitario = ?
    alt ¿Producto o Registro Sanitario ya registrado?
        DB-->>Service: Registro existente duplicado
        Service-->>Ctrl: Excepción: ProductoDuplicadoException
        Ctrl-->>PWA: HTTP 409 Conflict ("El medicamento o registro sanitario ya existe en el sistema")
        PWA-->>Regente: Muestra advertencia de duplicidad
    else Producto nuevo válido
        DB-->>Service: Null (No existe duplicado)
        
        Note over Service,DB: FASE 3: Transacción Atómica de Catálogo Multi-Nivel
        Service->>DB: BEGIN TRANSACTION (Nivel de Aislamiento: READ COMMITTED)
        
        Service->>DB: INSERT INTO productos (nombre_comercial, tipo_producto='MEDICAMENTO', estado='ACTIVO') RETURNING id_producto
        DB-->>Service: ID Producto: 512
        
        Service->>DB: INSERT INTO medicamentos (id_producto, principio_activo, concentracion, forma_farmaceutica, registro_sanitario, requiere_receta) VALUES (512, 'Amoxicilina', '500mg', 'Cápsula', 'EN-04512', TRUE)
        
        loop Por cada presentación definida (Caja, Blíster, Unidad)
            Service->>DB: INSERT INTO presentaciones_producto (id_producto, nombre_presentacion, factor_conversion, precio_venta) VALUES (512, 'Caja x 100', 100, 45.00), (512, 'Blíster x 10', 10, 5.00), (512, 'Unidad', 1, 0.60)
        end
        
        Service->>DB: INSERT INTO bitacora_auditoria (id_usuario, accion='CREACION_MEDICAMENTO', tabla_afectada='productos', registro_id=512)
        Service->>DB: COMMIT TRANSACTION (Persistencia definitiva)
        DB-->>Service: Transacción exitosa confirmada
        
        Note over Ctrl,Regente: FASE 4: Confirmación y Actualización de Catálogo Local
        Service-->>Ctrl: Retorna Entidad Medicamento Completa
        Ctrl-->>PWA: HTTP 201 Created {status: "SUCCESS", id_producto: 512, data: {...}}
        PWA->>PWA: Actualiza catálogo en caché de interfaz
        PWA-->>Regente: Mensaje de confirmación: "Medicamento y presentaciones registradas con éxito"
    end`;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'Segoe UI, Arial, sans-serif',
        fontSize: '13px',
        primaryColor: '#d1fae5',
        primaryTextColor: '#064e3b',
        primaryBorderColor: '#059669',
        lineColor: '#047857',
        secondaryColor: '#ccfbf1',
        tertiaryColor: '#f0fdfa',
        noteBkgColor: '#f0fdfa',
        noteTextColor: '#047857',
        noteBorderColor: '#10b981',
        actorBkg: '#059669',
        actorTextColor: '#ffffff',
        actorBorder: '#047857',
        actorLineColor: '#059669',
        signalColor: '#047857',
        signalTextColor: '#064e3b',
        labelBoxBkgColor: '#d1fae5',
        labelBoxBorderColor: '#059669',
        labelTextColor: '#047857'
      }
    });

    let panZoomInstance = null;

    async function renderDiagram() {
      const target = document.getElementById('mermaid-target');
      const { svg } = await mermaid.render('mermaid-svg-44', mermaidCode);
      target.innerHTML = svg;

      const svgElement = target.querySelector('svg');
      svgElement.style.maxWidth = 'none';
      panZoomInstance = svgPanZoom(svgElement, {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.25,
        maxZoom: 5.0,
        onZoom: function(newScale) {
          document.getElementById('zoomText').textContent = `${Math.round(newScale * 100)}%`;
        }
      });

      document.getElementById('btnZoomIn').addEventListener('click', () => panZoomInstance.zoomIn());
      document.getElementById('btnZoomOut').addEventListener('click', () => panZoomInstance.zoomOut());
      document.getElementById('btnFit').addEventListener('click', () => {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      });

      document.getElementById('btnCopy').addEventListener('click', () => {
        navigator.clipboard.writeText(mermaidCode);
        const btn = document.getElementById('btnCopy');
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    window.addEventListener('load', renderDiagram);
    window.addEventListener('resize', () => {
      if (panZoomInstance) {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    });
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && window.parent && window.parent !== window && typeof window.parent.toggleSidebar === 'function') {
        window.parent.toggleSidebar();
      }
    });
  </script>
</body>
</html>
