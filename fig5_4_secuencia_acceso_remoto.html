<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fig 5.4 - Acceso Remoto Gerencial | Innofarma</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* BARRA DE CONTROL FLOTANTE (ESTILO MARIFARMA SALUD) */
    .hud-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid #0f172a;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 11.5px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .hud-status-badge {
      background: #0f172a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-hud {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #0f172a;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-hud:hover {
      background: #0f172a;
      color: #ffffff;
    }

    .zoom-text {
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      font-size: 11.5px;
      color: #0f172a;
    }

    .hud-hint {
      font-size: 10.5px;
      color: #64748b;
      margin-right: 6px;
      white-space: nowrap;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(#e0f2fe 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #f8fafc;
      cursor: grab;
    }

    #container:active {
      cursor: grabbing;
    }

    #mermaid-target {
      width: 100%;
      height: 100%;
    }

    #mermaid-target svg {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

  <header class="hud-bar">
    <span class="hud-status-badge">VISTA FÍSICA</span>
    <span class="hud-hint">Arrastrar: Pan | Rueda: Zoom</span>
    <div class="hud-controls">
      <button class="btn-hud" id="btnZoomOut">− Zoom</button>
      <span class="zoom-text" id="zoomText">100%</span>
      <button class="btn-hud" id="btnZoomIn">+ Zoom</button>
      <button class="btn-hud" id="btnFit">Ajustar</button>
      <button class="btn-hud" id="btnReset">Reset</button>
      <button class="btn-hud" id="btnCopy">Copiar Código</button>
    </div>
  </header>

  <div id="container">
    <div id="mermaid-target"></div>
  </div>

  <script>
    const mermaidCode = `sequenceDiagram
    autonumber
    actor Admin as Administradora (Móvil / Laptop)
    participant WG_Client as WireGuard Client (Móvil)
    participant Router as Router Local 1 (UDP 51820)
    participant WG_Server as WireGuard Server (PC1: 10.10.0.1)
    participant Nginx as Servidor Web / TLS (PC1: 443)
    participant Backend as Innofarma Backend (Laravel)
    participant DB as PostgreSQL 16

    Note over Admin,WG_Server: Paso 1: Enlace Seguro mediante Túnel Criptográfico
    Admin->>WG_Client: Activa conexión VPN WireGuard
    WG_Client->>Router: Handshake UDP encriptado (Puerto 51820)
    Router->>WG_Server: Reenvío de puerto (Port Forwarding)
    WG_Server-->>WG_Client: Handshake OK (Túnel asignado IP 10.10.0.3)

    Note over Admin,DB: Paso 2: Autenticación de Aplicación Web
    Admin->>Nginx: Accede a https://10.10.0.1/login (Tráfico encriptado)
    Nginx->>Backend: Entrega solicitud de inicio de sesión
    Admin->>Backend: Envía credenciales (Usuario + Contraseña)
    Backend->>DB: SELECT password_hash, rol FROM usuarios WHERE username = 'admin'
    DB-->>Backend: Retorna Hash Bcrypt y Rol 'ADMINISTRADOR'
    Backend->>Backend: Valida Hash Bcrypt y genera Sesión Segura (Cookie HttpOnly)
    Backend-->>Admin: Redirección a Dashboard General

    Note over Admin,DB: Paso 3: Monitoreo Consolidado de Ambos Locales
    Admin->>Backend: GET /api/v1/dashboard/reporte-consolidado
    Backend->>DB: Consulta ventas del día y alertas de stock de Local 1 y Local 2
    DB-->>Backend: Retorna datos agregados de ambas sucursales
    Backend-->>Admin: Muestra gráficos de ventas totales, caja y stock bajo`;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'Segoe UI, Arial, sans-serif',
        fontSize: '13px',
        primaryColor: '#e0f2fe',
        primaryTextColor: '#0c4a6e',
        primaryBorderColor: '#0284c7',
        lineColor: '#0284c7',
        secondaryColor: '#ccfbf1',
        tertiaryColor: '#f0fdfa',
        actorBkg: '#0f172a',
        actorTextColor: '#ffffff',
        actorBorder: '#1e293b'
      }
    });

    let panZoomInstance = null;

    async function renderDiagram() {
      const target = document.getElementById('mermaid-target');
      const { svg } = await mermaid.render('mermaid-svg-54', mermaidCode);
      target.innerHTML = svg;

      const svgElement = target.querySelector('svg');
      svgElement.style.maxWidth = 'none';
      panZoomInstance = svgPanZoom(svgElement, {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.25,
        maxZoom: 5.0,
        onZoom: function(newScale) {
          document.getElementById('zoomText').textContent = `${Math.round(newScale * 100)}%`;
        }
      });

      document.getElementById('btnZoomIn').addEventListener('click', () => panZoomInstance.zoomIn());
      document.getElementById('btnZoomOut').addEventListener('click', () => panZoomInstance.zoomOut());
      document.getElementById('btnFit').addEventListener('click', () => {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      });

      document.getElementById('btnCopy').addEventListener('click', () => {
        navigator.clipboard.writeText(mermaidCode);
        const btn = document.getElementById('btnCopy');
        const orig = btn.textContent;
        btn.textContent = '✓ Copiado';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    window.addEventListener('load', renderDiagram);
    window.addEventListener('resize', () => {
      if (panZoomInstance) {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    });
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && window.parent && window.parent !== window && typeof window.parent.toggleSidebar === 'function') {
        window.parent.toggleSidebar();
      }
    });
  </script>
</body>
</html>
