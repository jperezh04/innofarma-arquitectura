    const NS = 'http://www.w3.org/2000/svg';
    function el(tag, attrs = {}, text = null) {
      const node = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        node.setAttribute(k, v);
      }
      if (text !== null) node.textContent = text;
      return node;
    }

    function buildRoundedOrthogonalPath(pts, radius = 8) {
      if (pts.length < 2) return '';
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i - 1];
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[i + 1];
        const dx1 = x1 - x0, dy1 = y1 - y0;
        const dx2 = x2 - x1, dy2 = y2 - y1;
        const len1 = Math.hypot(dx1, dy1);
        const len2 = Math.hypot(dx2, dy2);
        const r = Math.min(radius, len1 / 2, len2 / 2);
        const sx = x1 - (dx1 / len1) * r;
        const sy = y1 - (dy1 / len1) * r;
        const ex = x1 + (dx2 / len2) * r;
        const ey = y1 + (dy2 / len2) * r;
        d += ` L ${sx} ${sy} Q ${x1} ${y1} ${ex} ${ey}`;
      }
      const last = pts[pts.length - 1];
      d += ` L ${last[0]} ${last[1]}`;
      return d;
    }

          'data-to': edge.to
        });

        const pathAttrs = {
          class: 'edge-line',
          d: buildRoundedOrthogonalPath(edge.pts, 7),
          fill: 'none',
          stroke: '#334155',
          'stroke-width': '1.75',
          'marker-end': 'url(#uml-arrow)'
        };
        if (edge.dashed) {
          pathAttrs['stroke-dasharray'] = '6,4';
        }
        g.appendChild(el('path', pathAttrs));

        // Etiqueta con pastilla blanca nítida
        const pillW = Math.max(96, edge.label.length * 6.9 + 18);
        const pillH = 22;
        g.appendChild(el('rect', {
          x: edge.lx - pillW / 2,
          y: edge.ly - pillH / 2,
          width: pillW,
          height: pillH,
          rx: 5,
          fill: '#ffffff',
          stroke: '#cbd5e1',
          'stroke-width': '1'
        }));
        g.appendChild(el('text', {
          x: edge.lx,
          y: edge.ly + 4,
          'text-anchor': 'middle',
          'font-size': '11.5',
          'font-weight': '700',
          fill: '#0f172a',
          'font-family': 'Segoe UI, Arial, sans-serif'
        }, edge.label));

        edgesLayer.appendChild(g);
      });

      // 2. Renderizar las 11 clases UML + Nota de alcance
      CLASSES.forEach((cls) => {
        const t = THEMES[cls.theme];
        const g = el('g', {
          class: 'uml-class',
          'data-id': cls.id,
          filter: 'url(#card-shadow)'
        });

        // Contenedor base redondeado
        g.appendChild(el('rect', {
          x: cls.x,
          y: cls.y,
          width: cls.w,
          height: cls.h,
          rx: 8,
          fill: t.bodyBg,
          stroke: t.stroke,
          'stroke-width': '2'
        }));

        const headerH = cls.isNote ? 38 : 48;

        // Cabecera superior coloreada con esquinas superiores redondeadas
        const hdrPath = `M ${cls.x + 8} ${cls.y} H ${cls.x + cls.w - 8} Q ${cls.x + cls.w} ${cls.y} ${cls.x + cls.w} ${cls.y + 8} V ${cls.y + headerH} H ${cls.x} V ${cls.y + 8} Q ${cls.x} ${cls.y} ${cls.x + 8} ${cls.y} Z`;
        g.appendChild(el('path', {
          d: hdrPath,
          fill: t.headerBg,
          stroke: t.stroke,
          'stroke-width': '2'
        }));

        if (cls.isNote) {
          g.appendChild(el('text', {
            x: cls.x + cls.w / 2,
            y: cls.y + 24,
            'text-anchor': 'middle',
            'font-size': '13',
            'font-weight': '800',
            fill: t.titleColor
          }, cls.name));

          cls.noteLines.forEach((line, i) => {
            g.appendChild(el('text', {
              x: cls.x + 14,
              y: cls.y + headerH + 26 + i * 20,
              'font-size': '12',
              'font-weight': '500',
              fill: '#422006'
            }, line));
          });

          // Línea divisoria inferior idéntica al formato del documento oficial
          g.appendChild(el('line', {
            x1: cls.x, y1: cls.y + cls.h - 34,
            x2: cls.x + cls.w, y2: cls.y + cls.h - 34,
            stroke: t.stroke, 'stroke-width': '1.4'
          }));
        } else {
          // Código EDU-XXXX + Nombre del módulo
          g.appendChild(el('text', {
            x: cls.x + cls.w / 2,
            y: cls.y + 19,
            'text-anchor': 'middle',
            'font-size': '12',
            'font-weight': '800',
            fill: t.codeColor
          }, cls.code));

          g.appendChild(el('text', {
            x: cls.x + cls.w / 2,
            y: cls.y + 38,
            'text-anchor': 'middle',
            'font-size': '12.5',
            'font-weight': '800',
            fill: t.titleColor
          }, cls.name));

          const attrH = 88;
          const divY = cls.y + headerH + attrH;

          // Atributos (-)
          cls.attrs.forEach((attr, i) => {
            g.appendChild(el('text', {
              x: cls.x + 14,
              y: cls.y + headerH + 21 + i * 19,
              'font-size': '12',
              'font-family': 'Consolas, "SFMono-Regular", Menlo, monospace',
              fill: '#1e293b'
            }, attr));
          });

          // Separador entre atributos y métodos
          g.appendChild(el('line', {
            x1: cls.x,
            y1: divY,
            x2: cls.x + cls.w,
            y2: divY,
            stroke: t.stroke,
            'stroke-width': '1.5'
          }));

          // Métodos (+)
          cls.methods.forEach((method, i) => {
            g.appendChild(el('text', {
              x: cls.x + 14,
              y: divY + 21 + i * 19,
              'font-size': '12',
              'font-family': 'Consolas, "SFMono-Regular", Menlo, monospace',
              'font-weight': '600',
              fill: '#0f172a'
            }, method));
          });

          // Interactividad de foco relacional al pasar el cursor
          g.addEventListener('mouseenter', () => {
            svgRoot.classList.add('has-focus');
            const connectedClasses = new Set([cls.id]);
            document.querySelectorAll('.uml-edge').forEach(edgeEl => {
              const from = edgeEl.getAttribute('data-from');
              const to = edgeEl.getAttribute('data-to');
              if (from === cls.id || to === cls.id) {
                edgeEl.classList.add('focused');
                connectedClasses.add(from);
                connectedClasses.add(to);
              } else {
                edgeEl.classList.remove('focused');
              }
            });
            document.querySelectorAll('.uml-class').forEach(clsEl => {
              if (connectedClasses.has(clsEl.getAttribute('data-id')) || clsEl.getAttribute('data-id') === 'NOTA') {
                clsEl.classList.add('focused');
              } else {
                clsEl.classList.remove('focused');
              }
            });
          });

          g.addEventListener('mouseleave', () => {
            svgRoot.classList.remove('has-focus');
            document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
          });
        }

        nodesLayer.appendChild(g);
      });
    }

    let panZoomInstance = null;

    window.addEventListener('load', () => {
      renderLogicalView();
      const svgElement = document.getElementById('logica-svg');

      panZoomInstance = svgPanZoom(svgElement, {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.25,
        maxZoom: 5.0,
        onZoom: function(newScale) {
          document.getElementById('zoomText').textContent = `${Math.round(newScale * 100)}%`;
        }
      });

      document.getElementById('btnZoomIn').addEventListener('click', () => panZoomInstance.zoomIn());
      document.getElementById('btnZoomOut').addEventListener('click', () => panZoomInstance.zoomOut());
      document.getElementById('btnFit').addEventListener('click', () => {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      });

      document.getElementById('btnSvg').addEventListener('click', () => {
        const serializer = new XMLSerializer();
        const svgBlob = new Blob([serializer.serializeToString(svgElement)], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Vista_Logica_Innofarma_V01.00.svg';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('btnCopy').addEventListener('click', () => {
        navigator.clipboard.writeText(mermaidCode);
        const btn = document.getElementById('btnCopy');
        const orig = btn.textContent;
        btn.textContent = '✓ Código Copiado';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    });

    window.addEventListener('resize', () => {
      if (panZoomInstance) {
        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    });

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && window.parent && window.parent !== window && typeof window.parent.toggleSidebar === 'function') {
        window.parent.toggleSidebar();
      }
    });
  </script>
</body>
</html>
